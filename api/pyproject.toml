[project]
name = "exercise-book-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.13.0",
]

[tool.uv]
dev-dependencies = [
    "httpx>=0.27.0",   # for FastAPI TestClient
    "pytest>=8.0.0",
]
